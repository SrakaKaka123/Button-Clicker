<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Game with Shop</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            margin-top: 20px;
        }

        #button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        #score-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: red;
            color: white;
            font-size: 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #score-button:active {
            transform: scale(0.9);
        }

        #shop-button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 30px;
        }

        #shop-button:hover {
            background-color: #2980b9;
        }

        #score {
            position: absolute;
            top: 20px;
        }

        /* Shop Menu */
        #shop-menu {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            z-index: 1000;
        }

        #shop-menu button {
            margin: 10px;
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
        }

        #shop-menu button:hover {
            background-color: #2ecc71;
        }

        /* Overlay */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="score">Score: 0</div>

    <div id="button-container">
        <button id="score-button">Click</button>
    </div>

    <button id="shop-button">Shop</button>

    <!-- Shop Menu and Overlay -->
    <div id="overlay"></div>
    <div id="shop-menu">
        <h2>Shop</h2>
        <p>Upgrade: Increase score per click</p>
        <button id="upgrade-button">Buy Upgrade (+1 per click) - Cost: 10</button>
        <button id="close-shop-button">Close Shop</button>
    </div>

    <script>
        let score = 0;
        let scorePerClick = 1;
        let upgradeCost = 10;

        const scoreButton = document.getElementById('score-button');
        const scoreDisplay = document.getElementById('score');
        const shopButton = document.getElementById('shop-button');
        const shopMenu = document.getElementById('shop-menu');
        const overlay = document.getElementById('overlay');
        const upgradeButton = document.getElementById('upgrade-button');
        const closeShopButton = document.getElementById('close-shop-button');

        // Handle score button click
        scoreButton.addEventListener('click', () => {
            score += scorePerClick;
            scoreDisplay.textContent = `Score: ${score}`;
            
            // Add animation to button when clicked
            scoreButton.classList.add('clicked');
            setTimeout(() => {
                scoreButton.classList.remove('clicked');
            }, 300);
        });

        // Handle shop button click
        shopButton.addEventListener('click', () => {
            overlay.style.display = 'block';
            shopMenu.style.display = 'block';
        });

        // Handle close shop button
        closeShopButton.addEventListener('click', () => {
            overlay.style.display = 'none';
            shopMenu.style.display = 'none';
        });

        // Handle upgrade purchase
        upgradeButton.addEventListener('click', () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                scorePerClick += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5); // Increase the cost for the next upgrade
                scoreDisplay.textContent = `Score: ${score}`;
                alert(`Upgrade purchased! Now you earn ${scorePerClick} per click.`);
            } else {
                alert("Not enough score for the upgrade.");
            }
        });
    </script>

</body>
</html>
